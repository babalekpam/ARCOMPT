services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arcompt
      POSTGRES_PASSWORD: arcompt
      POSTGRES_DB: arcompt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcompt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Authentification OIDC de développement : docker compose --profile auth up -d
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-arcompt.json:/opt/keycloak/data/import/realm-arcompt.json:ro

  # Stockage S3 compatible pour remplacer R2 en local : docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arcompt
      MINIO_ROOT_PASSWORD: arcompt-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # ---------------------------------------------------------------------------
  # Pile applicative conteneurisée : docker compose --profile app up --build
  #
  # Ce profil construit les MÊMES images que la production (JavaScript compilé,
  # sortie standalone de Next, utilisateur non root) : il sert à vérifier
  # localement ce qui sera déployé. Pour développer, `pnpm dev` reste la voie
  # normale — ces conteneurs ne rechargent rien à chaud.
  #
  # La production se déploie avec docker-compose.prod.yml (reverse proxy, TLS,
  # Keycloak en base). Voir docs/DEPLOYMENT.md.
  # ---------------------------------------------------------------------------

  # Migrations puis création du rôle de connexion applicatif, avant l'API.
  # Le propriétaire du schéma migre ; l'application se connecte ensuite avec
  # arcompt_app_login, soumis à la Row-Level Security. Même découpe qu'en
  # production, pour que le chemin testé soit celui qui sera exploité.
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: "no"
    command: ["sh", "-c", "node infra/docker/ops/migrate.mjs && node infra/docker/ops/provision-role.mjs"]
    environment:
      DATABASE_URL: postgres://arcompt:arcompt@postgres:5432/arcompt
      APP_DB_USER: arcompt_app_login
      APP_DB_PASSWORD: arcompt-app-local-dev-password
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      # Rôle applicatif, pas le propriétaire du schéma.
      DATABASE_URL: postgres://arcompt_app_login:arcompt-app-local-dev-password@postgres:5432/arcompt
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
    volumes:
      - apistorage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "4000:4000"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file: .env
    environment:
      API_URL: http://api:4000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
  apistorage:
